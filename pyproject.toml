[project]
name = "bpp-analyzer"
version = "0.3.0"
description = "Analyzer V5 rebuild: single-process pipeline publishing the analyzer-v5 contract"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1",
    "duckdb>=1.1",
    "pyarrow>=17",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "boto3>=1.35",
    "python-dotenv>=1.0",
]

[project.scripts]
bpp = "bpp_analyzer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bpp_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
